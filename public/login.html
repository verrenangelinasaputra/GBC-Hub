<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Login — GBC Cash Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-brand">
      <span class="brand-mark">G</span>
      <div>
        <b>GBC CASH MANAGEMENT</b>
        <small>Bank &amp; Kas Kecil</small>
      </div>
    </div>
    <form class="login-card panel" id="loginForm">
      <h1>Masuk ke sistem</h1>
      <p>Masuk dengan username/email dan password. Akun baru: <a href="/register">daftar di sini</a>.</p>
      <label for="login">Username / Email</label>
      <input id="login" name="login" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-full" type="submit" id="loginSubmit">Masuk</button>
      <p style="margin:10px 0 0;text-align:center"><a href="/forgot-password">Lupa password?</a></p>
      <div id="loginMessage" class="inline-message" aria-live="polite"></div>
    </form>
    <p class="login-foot">Internal workspace · Session aman dengan cookie HttpOnly</p>
  </div>
  <script src="/progress.js"></script>
  <script src="/login.js"></script>
</body>
</html>
