<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Lupa password — GBC Cash Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-brand">
      <span class="brand-mark">G</span>
      <div>
        <b>GBC CASH MANAGEMENT</b>
        <small>Reset password</small>
      </div>
    </div>
    <form class="login-card panel" id="forgotForm">
      <h1>Lupa password</h1>
      <p>Kode verifikasi dikirim ke email terdaftar (akun hasil registrasi).</p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <div id="resetFields" class="hidden">
        <label for="code">Kode verifikasi</label>
        <input id="code" name="code" type="text" inputmode="numeric" maxlength="6">
        <button type="button" class="btn btn-soft btn-full hidden" id="resendCodeBtn" disabled>Kirim ulang kode</button>
        <p class="login-foot" style="margin:8px 0 12px;font-size:13px">Tombol kirim ulang aktif setelah 1 menit.</p>
        <label for="password">Password baru</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8">
        <label for="confirmPassword">Konfirmasi password baru</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8">
      </div>
      <button class="btn btn-primary btn-full" type="submit" id="forgotSubmit">Kirim kode</button>
      <div id="forgotMessage" class="inline-message" aria-live="polite"></div>
      <p class="login-foot" style="margin-top:12px"><a href="/login">Kembali ke login</a></p>
    </form>
  </div>
  <script src="/progress.js"></script>
  <script src="/auth-resend.js"></script>
  <script src="/forgot-password.js"></script>
</body>
</html>
